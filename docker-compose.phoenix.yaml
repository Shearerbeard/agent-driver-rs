# Phoenix/OTel + MCP infrastructure for agent-driver-rs tracing and tool testing
#
# Remote Phoenix instance: point PHOENIX_ENDPOINT at your own host
#   export PHOENIX_ENDPOINT=http://your-phoenix-host:4317
#
# This compose file is for local development when the remote instance is unavailable.
# Phoenix has a built-in OTLP receiver, so no separate collector is needed.
#
# Usage:
#   docker compose -f docker-compose.phoenix.yaml up -d
#   docker compose -f docker-compose.phoenix.yaml down

services:
  phoenix:
    image: arizephoenix/phoenix:latest
    container_name: phoenix-server
    ports:
      - "6006:6006"   # Phoenix UI
      - "4317:4317"   # OTLP gRPC receiver
    environment:
      - PHOENIX_PORT=6006
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6006/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mcp-filesystem:
    image: mcp/filesystem
    container_name: mcp-filesystem
    ports:
      - "3001:3000"   # MCP Streamable HTTP server
    environment:
      - ALLOWED_DIRECTORIES=/workspace
    volumes:
      - workspace:/workspace
    restart: unless-stopped

volumes:
  workspace:
