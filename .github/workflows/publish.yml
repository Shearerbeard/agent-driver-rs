name: publish

# Tag-driven publish, same process as Epoch: the tag names a version that
# already exists in the tree. Bump the version in Cargo.toml and cut a
# dated CHANGELOG entry in a commit, then tag vX.Y.Z; this workflow
# verifies the three agree, runs the make-check gates, and uploads.
#
# Pre-1.0 convention: breaking API changes bump the minor (0.1 -> 0.2);
# everything else bumps the patch (0.1.0 -> 0.1.1).

on:
  push:
    tags: ["v*"]

jobs:
  verify:
    name: tag / manifest / changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Verify
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[0].version')
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::tag v$TAG does not match Cargo.toml version $VERSION"
            exit 1
          fi
          if ! grep -q "^## \[$TAG\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$TAG]' entry"
            exit 1
          fi

  gates:
    name: fmt + clippy + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-features --locked -- -D warnings
      - name: Test
        run: cargo test --all-features --locked

  publish:
    name: publish to crates.io
    needs: [verify, gates]
    runs-on: ubuntu-latest
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Publish agent-driver
        run: cargo publish --locked
