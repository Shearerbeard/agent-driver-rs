[package]
name = "agent-driver-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["anthropic", "openai", "openrouter"]
anthropic = []
openai = ["dep:async-openai"]
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-config", "dep:aws-smithy-types"]
openrouter = []
ollama = ["dep:ollama-rs"]
mcp = ["dep:rmcp"]
mcp-http = ["mcp", "rmcp/transport-streamable-http-client-reqwest"]
schema-sanitize = ["dep:mcp-openai-bridge"]
phoenix = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:opentelemetry-semantic-conventions"]
test-support = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Configuration (env loading via dotenvy, manual parsing)
dotenvy = "0.15"
url = { version = "2", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"

# Error handling
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Retry/backoff for rate limiting
backoff = { version = "0.4", features = ["tokio"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Provider SDKs (optional)
async-openai = { version = "0.28", optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }
ollama-rs = { version = "0.3", features = ["stream"], optional = true }
rmcp = { version = "0.14", features = ["client", "transport-child-process"], optional = true }
mcp-openai-bridge = { git = "ssh://git@github.com/example-org/mcp-openai-bridge.git", default-features = false, optional = true }

# OpenTelemetry for Phoenix (optional)
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio", "trace"], optional = true }
opentelemetry-otlp = { version = "0.15", optional = true }
opentelemetry-semantic-conventions = { version = "0.15", optional = true }

[dev-dependencies]
agent-driver-rs = { path = ".", features = ["test-support"] }

[[bin]]
name = "chat"
path = "src/bin/chat.rs"

[[example]]
name = "cluster_guardian"
required-features = ["ollama", "mcp-http", "schema-sanitize"]

[[example]]
name = "phoenix_integration_mock"
required-features = ["phoenix"]
