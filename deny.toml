[graph]
all-features = true

[advisories]
ignore = [
    { id = "RUSTSEC-2025-0052", reason = "async-std is discontinued; pulled transitively by opentelemetry_sdk 0.27.1; remove when OTel stack no longer pulls async-std" },
]

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.8

[[licenses.clarify]]
name = "ollama-rs"
version = "0.3.3"
expression = "MIT"
license-files = [{ path = "LICENSE.md", hash = 0x630febd2 }]

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
required-git-spec = "rev"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = [
    "ssh://git@github.com/example-org/mcp-openai-bridge.git",
]
