[package]
name = "agent-driver-rs"
version = "0.1.0"
edition = "2021"

[features]
default = ["anthropic", "openai", "openrouter"]
anthropic = []
openai = ["dep:async-openai"]
bedrock = ["dep:aws-sdk-bedrockruntime", "dep:aws-config", "dep:aws-smithy-types"]
openrouter = []
ollama = ["dep:ollama-rs"]
mcp = ["dep:rmcp"]
mcp-http = ["mcp", "rmcp/transport-streamable-http-client-reqwest"]
schema-sanitize = ["dep:mcp-openai-bridge"]
test-support = []

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tokio-stream = "0.1"
futures = "0.3"
async-trait = "0.1"
pin-project-lite = "0.2"

# Configuration (env loading via dotenvy, manual parsing)
dotenvy = "0.15"
url = { version = "2", features = ["serde"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP
reqwest = { version = "0.12", features = ["json", "stream"] }
reqwest-eventsource = "0.6"

# Error handling
thiserror = "1"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Retry/backoff for rate limiting
backoff = { version = "0.4", features = ["tokio"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Provider SDKs (optional)
async-openai = { version = "0.28", optional = true }
aws-sdk-bedrockruntime = { version = "1", optional = true }
aws-config = { version = "1", optional = true }
aws-smithy-types = { version = "1", optional = true }
ollama-rs = { version = "0.3", features = ["stream"], optional = true }
rmcp = { version = "0.14", features = ["client", "transport-child-process"], optional = true }
mcp-openai-bridge = { git = "ssh://git@github.com/example-org/mcp-openai-bridge.git", default-features = false, optional = true }

[dev-dependencies]
agent-driver-rs = { path = ".", features = ["test-support"] }

[[bin]]
name = "chat"
path = "src/bin/chat.rs"

[[example]]
name = "cluster_guardian"
required-features = ["ollama", "mcp-http", "schema-sanitize"]

# =============================================================================
# Lints — progressive adoption from rust-seed baseline
# Wave 1 (broad groups at warn) is always active.
# Subsequent waves promote individual restriction lints to deny.
# =============================================================================

[lints.rust]
let_underscore_drop = { level = "deny", priority = 127 }
non_ascii_idents = { level = "deny", priority = 127 }

[lints.clippy]
# --- Wave 1: Broad groups at warn (compile never breaks, just signals) ---
all = "warn"
correctness = "warn"
suspicious = "warn"
complexity = "warn"
perf = "warn"
style = "warn"
pedantic = "warn"

# --- Pedantic overrides (known conflicts / false positives) ---
collapsible_if = { level = "allow", priority = 127 }
let_and_return = { level = "allow", priority = 127 }
needless_continue = { level = "allow", priority = 127 }
needless_borrowed_reference = { level = "allow", priority = 127 }
redundant_else = { level = "allow", priority = 127 }
uninlined_format_args = { level = "allow", priority = 127 }
module_name_repetitions = { level = "allow", priority = 127 }

# --- Wave 2: Agent-critical safety (deny) ---
dbg_macro = { level = "deny", priority = 127 }
todo = { level = "deny", priority = 127 }
unimplemented = { level = "deny", priority = 127 }
panic_in_result_fn = { level = "deny", priority = 127 }
unused_result_ok = { level = "deny", priority = 127 }
exit = { level = "deny", priority = 127 }
missing_assert_message = { level = "deny", priority = 127 }
tests_outside_test_module = { level = "deny", priority = 127 }

# --- Wave 3: Ownership clarity (deny) ---
clone_on_ref_ptr = { level = "deny", priority = 127 }
str_to_string = { level = "deny", priority = 127 }
string_add = { level = "deny", priority = 127 }
string_slice = { level = "deny", priority = 127 }
rc_buffer = { level = "deny", priority = 127 }
rc_mutex = { level = "deny", priority = 127 }

# --- Wave 4: Exhaustiveness & correctness (deny) ---
wildcard_enum_match_arm = { level = "deny", priority = 127 }
rest_pat_in_fully_bound_structs = { level = "deny", priority = 127 }
assertions_on_result_states = { level = "deny", priority = 127 }
try_err = { level = "deny", priority = 127 }
error_impl_error = { level = "deny", priority = 127 }
return_and_then = { level = "deny", priority = 127 }

# --- Wave 5: Code hygiene & style (deny) ---
needless_raw_strings = { level = "deny", priority = 127 }
redundant_test_prefix = { level = "deny", priority = 127 }
semicolon_inside_block = { level = "deny", priority = 127 }
multiple_inherent_impl = { level = "deny", priority = 127 }
deref_by_slicing = { level = "deny", priority = 127 }
lossy_float_literal = { level = "deny", priority = 127 }
verbose_file_reads = { level = "deny", priority = 127 }
unused_trait_names = { level = "deny", priority = 127 }

# --- Wave 6: Concurrency & unsafe discipline (deny) ---
mutex_atomic = { level = "deny", priority = 127 }
mutex_integer = { level = "deny", priority = 127 }
mem_forget = { level = "deny", priority = 127 }
multiple_unsafe_ops_per_block = { level = "deny", priority = 127 }
undocumented_unsafe_blocks = { level = "deny", priority = 127 }
unnecessary_safety_comment = { level = "deny", priority = 127 }
unnecessary_safety_doc = { level = "deny", priority = 127 }
let_underscore_must_use = { level = "deny", priority = 127 }
infinite_loop = { level = "deny", priority = 127 }

# --- Wave 7: Final restriction lints (deny) ---
# impl_trait_in_params: skipped — idiomatic Rust uses `impl Into<String>` extensively
# mod_module_files: skipped — this codebase uses mod.rs convention
# partial_pub_fields: skipped — mixed pub/private fields are intentional (CollectedResponse)
# field_scoped_visibility_modifiers: skipped — pub(crate) is idiomatic for encapsulation
renamed_function_params = { level = "deny", priority = 127 }
allow_attributes_without_reason = { level = "deny", priority = 127 }
mixed_read_write_in_expression = { level = "deny", priority = 127 }
cfg_not_test = { level = "deny", priority = 127 }
